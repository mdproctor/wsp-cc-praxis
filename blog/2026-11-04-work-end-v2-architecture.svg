<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'SF Mono', 'Menlo', 'Consolas', monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="580" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Before vs After: Work-End Architecture</text>

  <!-- LEFT: Before -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Before: Single Pipeline</text>

  <!-- Pipeline box -->
  <rect x="40" y="75" width="320" height="440" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Steps stacked -->
  <rect x="60" y="90" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="105" text-anchor="middle" font-size="10" fill="#7f1d1d">code_review (judgment)</text>

  <rect x="60" y="118" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="133" text-anchor="middle" font-size="10" fill="#7f1d1d">squash_plan (judgment)</text>

  <rect x="60" y="146" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="161" text-anchor="middle" font-size="10" fill="#7f1d1d">artifact_promote (mechanical)</text>

  <rect x="60" y="174" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="189" text-anchor="middle" font-size="10" fill="#7f1d1d">blog_write (judgment)</text>

  <rect x="60" y="202" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="217" text-anchor="middle" font-size="10" fill="#7f1d1d">forcing_function (judgment)</text>

  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#9ca3af">... 23 more steps ...</text>

  <rect x="60" y="252" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="267" text-anchor="middle" font-size="10" fill="#7f1d1d">land (mechanical)</text>

  <rect x="60" y="280" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="295" text-anchor="middle" font-size="10" fill="#7f1d1d">stamp (mechanical)</text>

  <rect x="60" y="308" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="323" text-anchor="middle" font-size="10" fill="#7f1d1d">close_issues (mechanical)</text>

  <rect x="60" y="336" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="351" text-anchor="middle" font-size="10" fill="#7f1d1d">queue_advance (mechanical)</text>

  <rect x="60" y="364" width="280" height="22" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
  <text x="200" y="379" text-anchor="middle" font-size="10" fill="#7f1d1d">cleanup (mechanical)</text>

  <!-- Shared state callout -->
  <rect x="60" y="400" width="280" height="60" rx="4" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="200" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#713f12">Shared mutable state</text>
  <text x="200" y="433" text-anchor="middle" font-size="9" fill="#854d0e">.plan (queue + lifecycle) · .close-progress</text>
  <text x="200" y="446" text-anchor="middle" font-size="9" fill="#854d0e">OrchestratorContext · meta_state</text>

  <!-- Stats -->
  <text x="200" y="485" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">53 steps · 5 modes · 10,800 LOC</text>
  <text x="200" y="500" text-anchor="middle" font-size="10" fill="#991b1b">7 paths can delete the queue</text>

  <!-- RIGHT: After -->
  <text x="620" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">After: Three Isolated Phases</text>

  <!-- Pre-close -->
  <rect x="470" y="75" width="320" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="630" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">PRE-CLOSE</text>
  <text x="630" y="112" text-anchor="middle" font-size="10" fill="#15803d">LLM-driven · independent · advisory</text>
  <text x="500" y="132" font-size="10" fill="#166534">review</text>
  <text x="560" y="132" font-size="10" fill="#166534">blog</text>
  <text x="610" y="132" font-size="10" fill="#166534">promote</text>
  <text x="680" y="132" font-size="10" fill="#166534">squash plan</text>
  <text x="630" y="152" text-anchor="middle" font-size="9" fill="#15803d">each writes to git · failures don't propagate</text>
  <text x="630" y="168" text-anchor="middle" font-size="9" fill="#15803d">uses existing skills, not custom pipeline</text>

  <!-- Arrow -->
  <line x1="630" y1="190" x2="630" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="204" font-size="9" fill="#64748b">git state</text>

  <!-- Ceremony -->
  <rect x="470" y="215" width="320" height="155" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">CLOSE CEREMONY</text>
  <text x="630" y="252" text-anchor="middle" font-size="10" fill="#1d4ed8">single Python invocation · fully mechanical</text>

  <rect x="490" y="262" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="550" y="275" text-anchor="middle" font-size="9" fill="#1e3a5f">1. resolve</text>

  <rect x="620" y="262" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="680" y="275" text-anchor="middle" font-size="9" fill="#1e3a5f">2. preflight</text>

  <rect x="490" y="286" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="550" y="299" text-anchor="middle" font-size="9" fill="#1e3a5f">3. land</text>

  <rect x="620" y="286" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="680" y="299" text-anchor="middle" font-size="9" fill="#1e3a5f">4. stamp</text>

  <rect x="490" y="310" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="550" y="323" text-anchor="middle" font-size="9" fill="#1e3a5f">5. elevate queue</text>

  <rect x="620" y="310" width="120" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="680" y="323" text-anchor="middle" font-size="9" fill="#1e3a5f">6. checkout</text>

  <rect x="555" y="334" width="150" height="18" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="630" y="347" text-anchor="middle" font-size="9" fill="#1e3a5f">7. advance + persist</text>

  <!-- Arrow -->
  <line x1="630" y1="375" x2="630" y2="395" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="389" font-size="9" fill="#64748b">git state</text>

  <!-- Post-close -->
  <rect x="470" y="400" width="320" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="630" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">POST-CLOSE</text>
  <text x="630" y="437" text-anchor="middle" font-size="10" fill="#15803d">close issues · archive slot · report</text>
  <text x="630" y="452" text-anchor="middle" font-size="9" fill="#15803d">failures non-fatal — code already landed</text>

  <!-- Queue isolation callout -->
  <rect x="470" y="480" width="320" height="45" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="630" y="498" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">Queue is never touched by close logic</text>
  <text x="630" y="513" text-anchor="middle" font-size="9" fill="#065f46">.queue (persistent) · .close-state (ephemeral)</text>

  <!-- Stats -->
  <text x="630" y="548" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">7 steps · 1 path · ~400 LOC</text>
  <text x="630" y="563" text-anchor="middle" font-size="10" fill="#166534">0 paths can delete the queue</text>
</svg>
